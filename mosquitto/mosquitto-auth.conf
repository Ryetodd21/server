# Wave 4: mosquitto config with password authentication.
#
# The previous default (anonymous on port 1883) was acceptable only for
# internal Docker network. Production exposes the broker publicly via
# Cloudflare Tunnel at `tcp://monitorterop.my.id:1883` — anonymous auth
# meant anyone on the internet could:
#   - subscribe to `dashboard/broadcast` (read admin-pushed events)
#   - publish to `students/$id/logs` and `students/$id/location` (inject fake data)
#
# This file replaces the image default. Mounted into the mqtt container via
# docker-compose.yml volumes. Pair with `passwords` file (generated by
# `mosquitto_passwd -c`) at /mosquitto/passwords.
#
# Rotation procedure:
#   1. Generate new hash: `mosquitto_passwd -b passwords monitorung <new_password>`
#   2. Update .env.production: MQTT_PASSWORD=<new>
#   3. Rebuild + redeploy api/subscriber (env picked up at container start)
#   4. Rebuild Android APK with new BuildConfig (gradle property or env)
#   5. Force-restart mqtt container to reload the file
#   6. Verify: mosquitto_pub with OLD creds → should fail with "Not authorized"

listener 1883
allow_anonymous false
password_file /mosquitto/passwords

# Round 26 (P1) — MQTT-over-WebSockets for Android clients.
#
# Mosquitto serves both:
#   - port 1883 plaintext MQTT (server-side subscriber, internal Docker
#     network, no TLS needed inside the trusted network)
#   - port 9001 WebSockets (Android clients via Cloudflare Tunnel, TLS
#     terminated at the Cloudflare edge)
#
# The same auth applies to both listeners. Android gets the WSS URL
# via `settings.MQTT_PUBLIC_URL` (resolved through GET /api/config/campus)
# and connects with `wss://mqtt.monitorterop.my.id/mqtt` — Paho 1.2.5
# supports WSS natively via the URI scheme.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/passwords

# Payload cap — defend the subscriber from runaway publishers.
# Default is ~268MB which can OOM the python subscriber on a single bad
# message. 64KB accommodates one day of (apps + locations) from Android
# even with the largest known payload shape (~30 sessions × 200B JSON
# + location logs), while still rejecting pathological bulk uploads
# that should be split into smaller batches at the publisher.
max_packet_size 65536
message_size_limit 65536

# Keep the HTTP API on 9883 for mosquitto's own dashboard (no auth needed
# there since it only exposes $SYS topics — internal monitoring).
listener 9883
protocol http_api
http_dir /usr/share/mosquitto/dashboard